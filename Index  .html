
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily Out of Service</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .maintenance {
            background: #ffffff;
            padding: 45px 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            font-size: 27px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #fff3cd;
            color: #856404;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="maintenance">

        <div class="icon">🛠️</div>

        <h1>Temporarily Out of Service</h1>

        <p>
            This site is temporarily unavailable due to
            scheduled maintenance.
            <br><br>
            We are working to restore the service as soon
            as possible. Thank you for your patience.
        </p>

        <div class="status">
            ● UNDER MAINTENANCE
        </div>

        <div class="footer">
            © 2026 KRISH TECK. All Rights Reserved.
        </div>

    </div>

</body>
</html>
