<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="manuals/logo (2).ico"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>User Manuals Portal - Enterprise Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Document Portal Specialized Grid & Responsive Overrides */
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .portal-wrapper {
            display: grid;
            grid-template-columns: 380px 1fr;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .portal-sidebar {
            background: var(--ent-surface);
            border-right: 1px solid var(--ent-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            z-index: 20;
        }

        .portal-search-container {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--ent-border);
            background: var(--ent-surface);
        }

        .portal-filter-container {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            overflow-x: auto;
            border-bottom: 1px solid var(--ent-border);
            background: var(--ent-bg);
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .portal-filter-container::-webkit-scrollbar { display: none; }

        .portal-doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .viewer-container {
            display: flex;
            flex-direction: column;
            background: var(--ent-bg);
            height: 100%;
            overflow: hidden;
        }

        .viewer-header-bar {
            height: 56px;
            background: var(--ent-surface);
            border-bottom: 1px solid var(--ent-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
            gap: 1rem;
        }

        .viewer-content-area {
            flex: 1;
            padding: 1rem 1.25rem 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .viewer-frame-box {
            width: 100%;
            height: 100%;
            border-radius: var(--ent-radius-lg);
            border: 1px solid var(--ent-border);
            background: var(--ent-surface);
            box-shadow: var(--ent-shadow);
            overflow: hidden;
            position: relative;
        }

        .viewer-frame-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty-viewer-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--ent-text-muted);
            background: var(--ent-surface);
            text-align: center;
            padding: 2rem;
        }

        .empty-state-icon-box {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--ent-accent-light);
            color: var(--ent-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 991.98px) {
            .portal-wrapper {
                grid-template-columns: 1fr;
            }
            .portal-sidebar {
                position: fixed;
                left: -100%;
                top: 64px;
                bottom: 0;
                width: 85%;
                max-width: 360px;
                transition: left 0.3s ease;
                box-shadow: var(--ent-shadow-lg);
            }
            .portal-sidebar.open {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Top Global App Navbar -->
    <header class="navbar d-flex justify-content-between align-items-center flex-shrink-0">
        <div class="d-flex align-items-center gap-2">
            <button class="btn pill-nav-dark d-lg-none" onclick="toggleMobileSidebar()" aria-label="Toggle Documents Drawer">
                <i class="fa-solid fa-folder-tree"></i>
            </button>
            <a href="maindashbod.html" class="d-flex align-items-center gap-2 text-decoration-none">
                <img src="manuals/logo (2).ico" alt="Logo" style="height: 32px; width: 32px;">
                <span class="fw-bold text-dark-emphasis d-none d-sm-inline">User Manuals Portal</span>
            </a>
        </div>

        <!-- Central Quick Navigation Switcher -->
        <nav class="d-none d-md-flex align-items-center gap-2">
            <a href="maindashbod.html" class="pill-nav-soft"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="library.html" class="pill-nav-soft"><i class="fa-solid fa-list-check"></i> Library</a>
            <a href="config.html" class="pill-nav-soft"><i class="fa-solid fa-sliders"></i> Config</a>
            <a href="index2.html" class="pill-nav-soft"><i class="fa-solid fa-microchip"></i> MODSCAN</a>
            <a href="video1.html" class="pill-nav-soft"><i class="fa-solid fa-circle-play"></i> Videos</a>
            <a href="online services report/index.html" class="pill-nav-soft"><i class="fa-solid fa-file-invoice"></i> Reports</a>
        </nav>

        <div class="d-flex align-items-center gap-2">
            <div class="pill-nav-white d-none d-lg-flex">
                <i class="fa-regular fa-clock text-primary"></i>
                <span id="liveClock">Loading...</span>
            </div>
            <button class="btn pill-nav-dark" id="themeToggle" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="btn pill-nav-dark text-danger btn-logout" title="Sign Out">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="d-none d-sm-inline ms-1 fw-semibold">Logout</span>
            </button>
        </div>
    </header>

    <!-- Backdrop for mobile drawer -->
    <div id="sidebar-backdrop" onclick="toggleMobileSidebar()"></div>

    <!-- Main Portal Workspace -->
    <div class="portal-wrapper">
        <!-- Documents Sidebar -->
        <aside class="portal-sidebar" id="portalSidebar">
            <!-- Search Box -->
            <div class="portal-search-container">
                <div class="input-group">
                    <span class="input-group-text border-end-0 bg-transparent text-muted">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchInput" 
                           placeholder="Search manuals & guides..." onkeyup="renderDocs()" autocomplete="off">
                </div>
            </div>

            <!-- Category Filter Tags -->
            <div class="portal-filter-container" id="filterContainer"></div>

            <!-- Documents List Group -->
            <div class="portal-doc-list" id="docList">
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                    Loading documentation...
                </div>
            </div>
        </aside>

        <!-- Right Preview / PDF Viewer -->
        <main class="viewer-container">
            <!-- Viewer Header Toolbar -->
            <div class="viewer-header-bar">
                <div class="d-flex align-items-center gap-2 overflow-hidden">
                    <i class="fa-regular fa-file-pdf text-danger fs-5 flex-shrink-0"></i>
                    <h6 class="mb-0 fw-bold text-truncate" id="currentTitle">Select a document from the left</h6>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-sm btn-primary" onclick="openInNewTab()" id="openBtn" style="display: none;">
                        <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Open Fullscreen
                    </button>
                </div>
            </div>

            <!-- Viewer Iframe Frame Box -->
            <div class="viewer-content-area">
                <div class="viewer-frame-box">
                    <div class="empty-viewer-state" id="emptyState">
                        <div class="empty-state-icon-box">
                            <i class="fa-solid fa-book-open-reader"></i>
                        </div>
                        <h5 class="fw-bold text-dark-emphasis mb-1">No Document Selected</h5>
                        <p class="text-muted small mb-0">Browse categories and select any user manual or report to preview here</p>
                    </div>
                    <iframe id="doc-frame" style="display: none;" title="Document viewer"></iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap & App Modules -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>

    <!-- Firebase Realtime Sync Script -->
    <script type="module">
        import { listenToDocuments } from './firebase.js';

        window.categories = [
            { name: 'All', color: '#2563eb', showInList: true },
            { name: 'Manual', color: '#10b981' },
            { name: 'SERVES REPORTS', color: '#0ea5e9' },
            { name: 'LDM', color: '#f59e0b' },
            { name: 'CAAQMS', color: '#f97316' },
            { name: 'OCEMS', color: '#3b82f6' },
            { name: 'Flow Meters', color: '#6366f1' },
            { name: 'Spare list all', color: '#8b5cf6' },
            { name: 'Installation Requirements', color: '#ef4444' }
        ];

        window.documents = [];
        window.currentFilter = 'All';
        window.currentDocId = null;

        function processRecords(dbDocs) {
            let processedDocs = [];
            let idCounter = 1;

            for (const key in dbDocs) {
                const item = dbDocs[key];
                const cats = Array.isArray(item.category) ? item.category : [item.category];

                cats.forEach((cat) => {
                    if (!cat) return;
                    processedDocs.push({
                        id: idCounter++,
                        title: item.title,
                        file: item.file,
                        category: cat,
                        size: item.size || "PDF Document",
                        icon: item.icon || "📄"
                    });
                });
            }
            return processedDocs;
        }

        listenToDocuments((data) => {
            window.documents = data ? processRecords(data) : [];
            renderDocs();
        });

        window.renderFilters = function() {
            const container = document.getElementById('filterContainer');
            const visibleCategories = window.categories.filter(c => c.showInList !== false);

            container.innerHTML = visibleCategories.map(cat => `
                <button class="doc-tag ${cat.name === window.currentFilter ? 'active' : ''}" 
                        onclick="setFilter('${cat.name}', this)">
                    <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${cat.color};"></span>
                    ${cat.name}
                </button>
            `).join('');
        };

        window.setFilter = function(filterName, btn) {
            window.currentFilter = filterName;
            document.querySelectorAll('.doc-tag').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderDocs();
        };

        window.renderDocs = function() {
            const list = document.getElementById('docList');
            const search = (document.getElementById('searchInput')?.value || '').toLowerCase();

            let filtered = window.documents.filter(d => {
                const matchesSearch = d.title.toLowerCase().includes(search);
                const matchesCategory = window.currentFilter === 'All' || d.category === window.currentFilter;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="fa-regular fa-folder-open fs-2 d-block mb-2 text-secondary"></i>
                        <div class="fw-semibold">No documents found</div>
                        <div class="small">Try adjusting your search or category filter</div>
                    </div>
                `;
                return;
            }

            const grouped = filtered.reduce((acc, doc) => {
                if (!acc[doc.category]) acc[doc.category] = [];
                acc[doc.category].push(doc);
                return acc;
            }, {});

            let html = '';
            window.categories.filter(c => grouped[c.name]).forEach(catConfig => {
                const docs = grouped[catConfig.name];
                html += `
                    <div class="doc-category-group">
                        <div class="doc-category-header">
                            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${catConfig.color};"></span>
                            <span style="color:${catConfig.color};">${catConfig.name}</span>
                            <span class="badge badge-soft-primary ms-auto">${docs.length}</span>
                        </div>
                        ${docs.map(doc => `
                            <div class="doc-card-item ${window.currentDocId === doc.id ? 'active' : ''}" 
                                 onclick="loadDoc(${doc.id})" data-id="${doc.id}">
                                <div class="doc-card-icon">
                                    <i class="fa-regular fa-file-pdf text-danger"></i>
                                </div>
                                <div class="flex-grow-1 overflow-hidden">
                                    <div class="doc-card-title" title="${doc.title}">${doc.title}</div>
                                    <div class="doc-card-meta">
                                        <span class="badge badge-soft-info">${doc.category}</span>
                                        <span>${doc.size}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            });
            list.innerHTML = html;
        };

        window.loadDoc = function(id) {
            const doc = window.documents.find(d => d.id === id);
            if (!doc) return;

            window.currentDocId = id;
            document.querySelectorAll('.doc-card-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.querySelector(`.doc-card-item[data-id="${id}"]`);
            if (activeEl) activeEl.classList.add('active');

            document.getElementById('currentTitle').textContent = doc.title;
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('doc-frame').style.display = 'block';
            document.getElementById('openBtn').style.display = 'inline-flex';

            const frame = document.getElementById('doc-frame');
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            frame.src = isMobile 
                ? `https://docs.google.com/viewer?url=${encodeURIComponent(doc.file)}&embedded=true` 
                : doc.file;

            if (window.innerWidth <= 991) {
                toggleMobileSidebar();
            }
        };

        window.openInNewTab = function() {
            if (window.currentDocId) {
                const doc = window.documents.find(d => d.id === window.currentDocId);
                if (doc) window.open(doc.file, '_blank');
            }
        };

        window.toggleMobileSidebar = function() {
            const sidebar = document.getElementById('portalSidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('open');
            backdrop.classList.toggle('active', sidebar.classList.contains('open'));
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderDocs();
        });
    </script>

    <script>
        // Access Protection
        if (sessionStorage.getItem("verified") !== "true") {
            window.location.replace("index.html");
        }
        window.addEventListener("pageshow", function () {
            if (sessionStorage.getItem("verified") !== "true") {
                window.location.replace("index.html");
            }
        });
    </script>
</body>
</html>
